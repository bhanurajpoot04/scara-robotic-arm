<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>
  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="320" y="40" font-size="22" font-weight="bold" fill="#1f2328">SCARA arm - wiring overview</text>

  <!-- Laptop -->
  <rect x="20" y="60" width="250" height="100" rx="8" fill="#eef3fb" stroke="#3b6fb6" stroke-width="2"/>
  <text x="35" y="88" font-size="15" font-weight="bold" fill="#1f2328">Laptop (USB serial, 115200)</text>
  <text x="35" y="112" font-size="13" fill="#1f2328">Demo 1: Processing GUI</text>
  <text x="35" y="132" font-size="13" fill="#1f2328">Demo 2: Python gesture + webcam</text>
  <polyline points="270,110 460,110 460,200" fill="none" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>
  <text x="290" y="103" font-size="13" fill="#1f2328">USB</text>

  <!-- Power supply -->
  <rect x="20" y="330" width="200" height="90" rx="8" fill="#fff4e5" stroke="#d98200" stroke-width="2"/>
  <text x="35" y="362" font-size="15" font-weight="bold" fill="#1f2328">12 V DC supply</text>
  <text x="35" y="385" font-size="13" fill="#1f2328">10 A, motor power</text>
  <line x1="220" y1="375" x2="300" y2="375" stroke="#d98200" stroke-width="3" marker-end="url(#arr)"/>
  <text x="232" y="366" font-size="13" fill="#1f2328">12 V</text>

  <!-- Arduino + shield -->
  <rect x="300" y="200" width="320" height="440" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="228" font-size="16" font-weight="bold" fill="#1f2328">Arduino Uno + CNC Shield V3</text>

  <rect x="320" y="250" width="280" height="65" rx="6" fill="#ffffff" stroke="#c0392b"/>
  <text x="332" y="275" font-size="14" font-weight="bold" fill="#1f2328">X slot - A4988</text>
  <text x="332" y="297" font-size="13" fill="#1f2328">STEP D2 | DIR D5</text>

  <rect x="320" y="330" width="280" height="65" rx="6" fill="#ffffff" stroke="#c0392b"/>
  <text x="332" y="355" font-size="14" font-weight="bold" fill="#1f2328">Y slot - A4988</text>
  <text x="332" y="377" font-size="13" fill="#1f2328">STEP D3 | DIR D6</text>

  <rect x="320" y="410" width="280" height="65" rx="6" fill="#ffffff" stroke="#c0392b"/>
  <text x="332" y="435" font-size="14" font-weight="bold" fill="#1f2328">Z slot - A4988</text>
  <text x="332" y="457" font-size="13" fill="#1f2328">STEP D4 | DIR D7</text>

  <rect x="320" y="490" width="280" height="65" rx="6" fill="#ffffff" stroke="#c0392b"/>
  <text x="332" y="515" font-size="14" font-weight="bold" fill="#1f2328">A slot - A4988</text>
  <text x="332" y="537" font-size="13" fill="#1f2328">STEP D12 | DIR D13</text>

  <rect x="320" y="570" width="280" height="55" rx="6" fill="#ffffff" stroke="#c0392b"/>
  <text x="332" y="594" font-size="14" font-weight="bold" fill="#1f2328">Servo header</text>
  <text x="332" y="614" font-size="13" fill="#1f2328">Signal A0 | 5 V | GND</text>

  <!-- Motors -->
  <rect x="680" y="250" width="300" height="65" rx="6" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/>
  <text x="692" y="274" font-size="14" font-weight="bold" fill="#1f2328">NEMA 17 - J1 (shoulder)</text>
  <text x="692" y="296" font-size="13" fill="#1f2328">Limit switch LS1 on D11</text>
  <line x1="600" y1="282" x2="680" y2="282" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="680" y="330" width="300" height="65" rx="6" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/>
  <text x="692" y="354" font-size="14" font-weight="bold" fill="#1f2328">NEMA 17 - J2 (elbow)</text>
  <text x="692" y="376" font-size="13" fill="#1f2328">Limit switch LS2 on D10</text>
  <line x1="600" y1="362" x2="680" y2="362" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="680" y="410" width="300" height="65" rx="6" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/>
  <text x="692" y="434" font-size="14" font-weight="bold" fill="#1f2328">NEMA 17 - J3 (wrist rotation)</text>
  <text x="692" y="456" font-size="13" fill="#1f2328">Limit switch LS3 on D9</text>
  <line x1="600" y1="442" x2="680" y2="442" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="680" y="490" width="300" height="65" rx="6" fill="#e9f7ef" stroke="#1e8449" stroke-width="2"/>
  <text x="692" y="514" font-size="14" font-weight="bold" fill="#1f2328">NEMA 17 - Z lift (lead screw)</text>
  <text x="692" y="536" font-size="13" fill="#1f2328">Limit switch LS4 on A3</text>
  <line x1="600" y1="522" x2="680" y2="522" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Servo -->
  <rect x="680" y="570" width="300" height="55" rx="6" fill="#f3ecfa" stroke="#7d3c98" stroke-width="2"/>
  <text x="692" y="594" font-size="14" font-weight="bold" fill="#1f2328">MG996R gripper servo</text>
  <text x="692" y="614" font-size="13" fill="#1f2328">PWM A0, 5 V, GND</text>
  <line x1="600" y1="597" x2="680" y2="597" stroke="#444" stroke-width="2" marker-end="url(#arr)"/>

  <text x="20" y="672" font-size="12" fill="#444">Derived from the pin definitions in the original SCARA_Robot.ino. Limit switches are wired normally-closed to GND (INPUT_PULLUP).</text>
  <text x="20" y="690" font-size="12" fill="#444">Verify against your own build before powering the motors. Wiring overview only, not a PCB layout.</text>
</svg>
